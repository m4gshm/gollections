version: '3'

vars:
  GO_FLAGS: "-gcflags -m"

tasks:
  default:
    deps: [clean, build, test, readme, lint, bench]
  
  clean:
    cmds:
      - echo "#Cleaning..."
      - go clean -cache
      - go clean -testcache
  
  build:
    cmds:
      - echo "#Building..."
      - go env -w GOEXPERIMENT=newinliner
      - go fmt ./...
      - go vet ./...
      - go build ./...
  
  builda:
    cmds:
      - echo "#Building..."
      - go clean -cache
      - go build -gcflags $(GO_FLAGS) ./...
  
  test:
    cmds:
      - echo "#Running tests..."
      - go test ./...
  
  cover:
    cmds:
      - echo "#Running cover tests..."
      - go test -coverprofile=coverage.out -coverpkg=github.com/m4gshm/gollections/... ./...
      - go tool cover -html=coverage.out
  
  cover-console-out:
    cmds:
      - echo "#Running cover tests..."
      - go test -coverprofile=coverage.out -coverpkg=github.com/m4gshm/gollections/... ./...
      - go tool cover -func=coverage.out
  
  bench:
    cmds:
      - echo "#Running benchmarks..."
      - go env -w GOEXPERIMENT=newinliner
      - go test -benchtime 1s -bench . -benchmem ./...
  
  update:
    cmds:
      - echo "#Update tools..."
      - go install github.com/go-delve/delve/cmd/dlv@latest
      - go install golang.org/x/tools/gopls@latest
  
  lint:
    cmds:
      - echo "#Lints..."
      # - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - golangci-lint run
  
  readme:
    cmds:
      - echo "#README.md..."
      - asciidoctor -b docbook internal/docs/readme.adoc
      - pandoc -f docbook -t gfm internal/docs/readme.xml -o README.md
  
  pkgsite:
    cmds:
      - go install golang.org/x/pkgsite/cmd/pkgsite@latest
      - pkgsite